}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2321; --card:#243230; --line:#37504B; --ink:#EAE6DC; --muted:#A7B3AE;
  --teal:#5CC2B8; --teal-soft:#2A4A47; --orange:#F0935A; --orange-soft:#4A3426;
  --sky:#27413E; --hill1:#2F514A; --hill2:#3A6158; --road:#55645F; --tree:#7BB7A4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2321; --card:#243230; --line:#37504B; --ink:#EAE6DC; --muted:#A7B3AE;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:15px;

.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:26px;color:var(--teal);text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;border:2px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:7px 18px;cursor:pointer}

.node.cur circle.base{fill:var(--orange);stroke:var(--orange)}

.node text.num{font-size:24px;font-weight:700;fill:var(--teal);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ring{fill:none;stroke:var(--orange);stroke-width:3;opacity:.0}
.node.cur .ring{opacity:.7;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{r:30;opacity:.8}100%{r:52;opacity:0}}
.hero{transform-box:fill-box}
.bob{animation:bob .5s ease-in-out infinite alternate}
.still .bob{animation:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.bubble{margin:0 14px 14px;background:var(--card);border:2px solid var(--orange);border-radius:16px;padding:10px 14px;font-size:15px;line-height:1.6;box-shadow:0 2px 0 var(--orange);min-height:3.4em}

.tag.o{background:var(--orange-soft);color:var(--orange)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.col{background:var(--bg);border-radius:14px;padding:12px 14px;min-width:0}
.col h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--orange)}
.col ul{margin:0;padding-left:18px}
.col li{margin:2px 0}
.col p{margin:0}

.row .t small{display:block;color:var(--muted)}
.row .m{color:var(--muted);font-size:13px;white-space:nowrap}
.foot{color:var(--muted);font-size:13px}
@media (max-width:620px){.lbl{display:none}.bubble{font-size:14px}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){.bob,.node.cur .ring{animation:none}}
</style></head><body>

<div class="wrap">
  <div>
    <h1>讲课故事地图</h1>
    <p class="sub">一个角色，一条路，一站一站走完一节课。跟着故事走一遍，流程就记住了。</p>

</div>

  const d=catmull(pts);
  pathEl=el('path',{d,fill:'none',stroke:'var(--road)','stroke-width':16,'stroke-linecap':'round'});
  el('path',{d,fill:'none',stroke:'var(--card)','stroke-width':2,'stroke-dasharray':'2 14','stroke-linecap':'round',opacity:.8});
  total=pathEl.getTotalLength();
  lens=pts.map((_,i)=>{if(i===0)return 0;const t=document.createElementNS(NS,'path');t.setAttribute('d',catmull(pts.slice(0,i+1)));svg.appendChild(t);const L=t.getTotalLength();svg.removeChild(t);return L});
  visEl=el('path',{d,fill:'none',stroke:'var(--orange)','stroke-width':8,'stroke-linecap':'round','stroke-dasharray':`${total}`,'stroke-dashoffset':total});
  b.st.forEach((s,i)=>{
    const g=el('g',{class:'node',tabindex:0,role:'button','aria-label':`第${i+1}站 ${s.t}`});
    el('circle',{class:'ring',cx:pts[i][0],cy:pts[i][1],r:30},g);
    el('circle',{class:'base',cx:pts[i][0],cy:pts[i][1],r:27},g);
    const t=el('text',{class:'num',x:pts[i][0],y:pts[i][1]},g);t.textContent=i+1;
    const lb=el('text',{class:'lbl',x:pts[i][0],y:pts[i][1]+60},g);
    const short=s.t.split('：')[0];lb.textContent=short;
    g.addEventListener('click',()=>go(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i)}});
  });
  heroEl=el('g',{});
  const h=el('g',{class:'bob'},heroEl);
  el('rect',{x:-13,y:-12,width:26,height:30,rx:9,fill:'var(--teal)'},h);
  el('rect',{x:-19,y:-8,width:9,height:20,rx:4,fill:'var(--orange)'},h);
  el('circle',{cx:0,cy:-26,r:15,fill:'#F2C9A5'},h);
  el('path',{d:'M-15,-28 Q-12,-46 3,-42 Q16,-40 15,-26 Q8,-34 -4,-33 Q-10,-32 -15,-28Z',fill:'#3A2E28'},h);
  el('circle',{cx:-5,cy:-25,r:2,fill:'#3A2E28'},h);el('circle',{cx:6,cy:-25,r:2,fill:'#3A2E28'},h);
  el('path',{d:'M-4,-18 Q0,-14 5,-18',stroke:'#3A2E28','stroke-width':2,fill:'none','stroke-linecap':'round'},h);
  el('rect',{x:-9,y:18,width:7,height:10,rx:3,fill:'#3A2E28'},h);el('rect',{x:2,y:18,width:7,height:10,rx:3,fill:'#3A2E28'},h);
  place(lens[cur]);
}
function place(L){const p=pathEl.getPointAtLength(L);heroEl.setAttribute('transform',`translate(${p.x},${p.y-62})`);visEl.setAttribute('stroke-dashoffset',total-L)}
function marks(){svg.querySelectorAll('.node').forEach((g,i)=>{g.classList.toggle('done',i<cur);g.classList.toggle('cur',i===cur)})}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function typeIn(text){
  bubble.innerHTML=`<b>${esc(BOOKS[key].hero)}：</b><span id="bt"></span>`;const bt=$('#bt');
  if(REDUCE){bt.textContent=text;return}
  let i=0;clearInterval(typeIn.t);typeIn.t=setInterval(()=>{bt.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typeIn.t)},32)}
function render(){
  const b=BOOKS[key],s=b.st[cur],n=b.st.length;
  marks();typeIn(s.story);
  const hasM=b.st.some(x=>x.m);
  card.innerHTML=`<div class="tags"><span class="tag">第 ${cur+1} 站 / ${n}</span><span class="tag">${esc(s.pg)}</span>${s.m?`<span class="tag o">${s.m} 分钟</span>`:''}${s.opt?`<span class="tag o">${esc(s.opt)}</span>`:''}</div>
  <h2>${esc(s.t)}</h2>
  <div class="cols"><div class="col"><h3>这一站怎么讲</h3><ul>${s.say.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="col"><h3>学生做什么</h3><p>${esc(s.doing)}</p></div>
  <div class="col"><h3>走向下一站</h3><p>${esc(s.next)}</p></div></div>`;
  $('#prev').disabled=cur===0;$('#next').textContent=cur===n-1?'重新走一遍':'下一站';
  $('#pbar').style.width=((cur+1)/n*100)+'%';
  let acc=0;if(hasM)b.st.slice(0,cur+1).forEach(x=>acc+=x.m||0);
  $('#pmeta').textContent=hasM?`讲到这里约 ${acc} 分钟`:`第 ${cur+1} 站`;
  over.innerHTML=b.st.map((x,i)=>`<div class="row" role="button" tabindex="0" data-i="${i}" ${i===cur?'aria-current="true"':''}><span class="n">${i+1}</span><span class="t">${esc(x.t)}<small>${esc(x.pg)}</small></span><span class="m">${x.m?x.m+' 分钟':''}</span></div>`).join('');
  over.querySelectorAll('.row').forEach(r=>{r.onclick=()=>go(+r.dataset.i);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(+r.dataset.i)}}});
  $('#foot').textContent=b.foot;
}
function go(i){
  const n=BOOKS[key].st.length;i=Math.max(0,Math.min(n-1,i));
  const from=cur===i&&anim?null:lens[cur];cur=i;marks();render();
  const to=lens[i];cancelAnimationFrame(anim);
  const st=$('#stage');
  if(REDUCE||from==null||from===to){place(to);return}
  st.classList.remove('still');const t0=performance.now(),D=Math.min(1600,500+Math.abs(to-from)*1.6);
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;place(from+(to-from)*e);
    if(k<1)anim=requestAnimationFrame(step);else{anim=null;st.classList.add('still')}};
  anim=requestAnimationFrame(step);
}
function stopPlay(){clearInterval(timer);timer=null;const p=$('#play');p.setAttribute('aria-pressed','false');p.textContent='自动讲故事'}
function startPlay(){const p=$('#play');p.setAttribute('aria-pressed','true');p.textContent='暂停';
  timer=setInterval(()=>{if(cur>=BOOKS[key].st.length-1){stopPlay();return}go(cur+1)},9000)}
$('#next').onclick=()=>{stopPlay();go(cur===BOOKS[key].st.length-1?0:cur+1)};
$('#prev').onclick=()=>{stopPlay();go(cur-1)};
$('#play').onclick=()=>timer?stopPlay():startPlay();
document.addEventListener('keydown',e=>{if(e.target.closest('.node,.row,button'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
function setBook(k){stopPlay();key=k;cur=0;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));
  scene();render()}
$('#tabs').innerHTML=Object.keys(BOOKS).sort().map(k=>`<button class="tab" role="tab" data-k="${k}" type="button">${BOOKS[k].tab}</button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setBook(t.dataset.k));
setBook('ch5');
</script>
</body></html>
